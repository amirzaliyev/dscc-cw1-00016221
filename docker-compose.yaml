services:

  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/traefik.yaml:ro
      - letsencrypt:/letsencrypt
    networks:
      sales-net: {}

  postgresql:
    image: postgresql:16
    container_name: postgresql
    env_file:
      - .env.postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sales_user', '-d', 'sales_db']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - postgres_data:/data
    networks:
      database: {}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`16221.wiut911.uz`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    container_name: web
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      database: {}
      sales-net: {}

volumes:
  postgres_data:
  letsencrypt:

networks:
  sales-net:
  database:
