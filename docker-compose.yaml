services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static_files:ro
      - media_files:/app/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      sales-net:

  certbot:
    image: certbot/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email 16221@wiut.uz --agree-tos --no-eff-email -d 16221.wiut911.uz
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
  
  postgresql:
    image: postgres:16
    container_name: postgresql
    env_file:
      - .env.postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sales_user', '-d', 'sales_db']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - postgres_data:/data
    networks:
      database: {}

  web:
    image: amirzadocker/sales-manager:latest
    container_name: web
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    command: 
      sh -c "
        echo 'Waiting for database...' &&
        sleep 3 &&
        python3 manage.py migrate &&
        python3 manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4
      "
    volumes:
      - static_files:/app/static_files
      - media_files:/app/media
    networks:
      database: {}
      sales-net: {}

volumes:
  postgres_data:
  static_files:
  media_files:
  letsencrypt:
  certbot-webroot:

networks:
  sales-net:
  database:
