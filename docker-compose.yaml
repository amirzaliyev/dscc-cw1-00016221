services:

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/traefik.yaml:ro
      - letsencrypt:/letsencrypt
    networks:
      sales-net: {}

  postgresql:
    image: postgres:16
    container_name: postgresql
    env_file:
      - .env.postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sales_user', '-d', 'sales_db']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - postgres_data:/data
    networks:
      database: {}

  web:
    image: amirzadocker/sales-manager:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`16221.wiut911.uz`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
      - "traefik.docker.network=dscc-cw1-00016221_sales-net"
    container_name: web
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    command: 
      sh -c "
        echo 'Waiting for database...' &&
        sleep 3 &&
        python3 manage.py migrate &&
        rm -rf staticfiles/ &&
        python3 manage.py collectstatic &&
        gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4
      "
    volumes:
      - static_files:/app/static_files
      - media_files:/app/media
    networks:
      database: {}
      sales-net: {}

volumes:
  postgres_data:
  letsencrypt:
  static_files:
  media_files:

networks:
  sales-net:
  database:
