{% extends "base.html" %}

{% block title %}Delete Order #{{ order.id }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2>Delete Order #{{ order.id }}</h2>
        <p class="mt-1">Are you sure you want to delete this order ({{ order.total_amount }} total)?</p>
        <form method="post" class="mt-1">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'order_detail' order.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
