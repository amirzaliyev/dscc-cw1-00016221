{% extends "base.html" %}

{% block title %}Home - POS{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem;">
    <h1>POS</h1>
    <p class="mt-1">Manage your orders, customers, and products.</p>
    <div class="mt-1">
        {% if user.is_authenticated %}
            <a href="{% url 'order_list' %}" class="btn btn-primary">View Orders</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
        {% endif %}
    </div>
</div>
{% endblock %}
